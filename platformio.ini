[platformio]
default_envs = jc2432w328c

[env:jc2432w328c]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_mode = dio
board_build.partitions = default.csv
lib_deps = lovyan03/LovyanGFX@1.2.7
build_flags = -std=gnu++17
build_unflags = -std=gnu++11

[env:diagnostic]
extends = env:jc2432w328c
build_flags = ${env:jc2432w328c.build_flags} -DRALLY_DIAGNOSTIC=1
